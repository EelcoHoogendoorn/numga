[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "numga"
version = "2.0.0a0"
description = "Geometric algebra and extensors in NumPy, JAX and PyTorch"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Eelco Hoogendoorn", email = "hoogendoorn.eelco@gmail.com" }]
keywords = ["geometric algebra", "clifford algebra", "extensors", "numpy", "jax", "pytorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
linalg = [
    "scipy>=1.10",
]
jax = [
    "jax>=0.4",
]
torch = [
    "torch>=2.1",
]
examples = [
    "matplotlib>=3.7",
    "pillow>=10",
]
test = [
    "pytest>=7",
]

[project.urls]
Homepage = "https://github.com/EelcoHoogendoorn/numga"
Repository = "https://github.com/EelcoHoogendoorn/numga"

[tool.setuptools.packages.find]
include = ["numga*"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = [
    "--import-mode=importlib",
    "--strict-config",
    "--strict-markers",
    "-ra",
]
