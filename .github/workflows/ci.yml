name: CI

on:
  push:
    branches: [main, rewrite]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full:
    name: Full suite, Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[linalg,jax,examples,test]"
      # The suite guard in tests/conftest.py blocks whole-suite runs by default; CI runs everything.
      - run: python -m pytest --i-am-a-dunce-for-ignoring-instructions
        env:
          MPLBACKEND: Agg

  minimal:
    name: NumPy only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      # JAX and SciPy are optional: their tests skip, and the examples need matplotlib.
      - run: python -m pytest --i-am-a-dunce-for-ignoring-instructions tests --ignore=tests/examples
