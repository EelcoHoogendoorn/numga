name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build PyPI distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install "setuptools>=68" twine
      - name: Build numga wheel and sdist
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            python -m tools.package --tag "${{ github.ref_name }}" --outdir dist
          else
            python -m tools.package --outdir dist
          fi
      - name: Check metadata and README rendering
        run: python -m twine check --strict dist/*
      - name: Smoke-test installed wheel outside the repository
        run: |
          python -m venv "$RUNNER_TEMP/wheel-env"
          "$RUNNER_TEMP/wheel-env/bin/pip" install dist/*.whl
          (cd "$RUNNER_TEMP" && "$RUNNER_TEMP/wheel-env/bin/python" -c '
          import pathlib, numga
          assert "site-packages" in str(pathlib.Path(numga.__file__).resolve())
          ga = numga.Algebra("x+y+z+w0")
          mv = numga.NumpyContext(ga).multivector
          assert float(((mv.x ^ mv.y) & mv.xy.dual()).to_array()) == 1.0
          ')
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/*

  pypi:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/numga
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
